<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Dewu commerce scrolled spacing drift</title>
  <!-- @ianzhao DEWU_SCREENSHOT_EVIDENCE_V8 -->
  <style>
    :root { --accent: #01C2C3; --n140: #111111; }
    .phone-screen { width: 393px; height: 852px; overflow-x: hidden; }
    .scroll-content { min-height: 1590px; }
    .commerce-tabs { height: 54px; }
    .channel-grid { height: 146px; }
    .trust-row { height: 38px; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
    .product-card { padding: 18px; }
    .product-media { height: 180px; }
    .product-card strong { font-size: 17px; -webkit-line-clamp: 3; }
    .price { font-size: 18px; }
    .buyers { font-size: 14px; }
  </style>
</head>
<body data-evidence="dewu-screenshot-v8">
  <section class="phone-screen commerce-page">
    <div class="app-title">得物App</div>
    <main class="scroll-content">
      <div class="commerce-tabs"><span>推荐</span><span>潮玩</span><span>男装</span><span>美妆</span><span>鞋类</span><span>女装</span><span>三 分类</span></div>
      <div class="channel-grid">100%必中抽奖 天天低价 礼物指南 限时补贴 疯狂折扣 星宇宙 品牌专区 星愿森林 精选手机 全部频道</div>
      <div class="trust-row">先鉴别后发货的开创者</div>
      <div class="product-grid">
        <article class="product-card"><div class="product-media"></div><strong>Apple AirPods Pro 3 入耳</strong><b class="price">¥1957</b><span class="buyers">4.2万人付款</span></article>
      </div>
    </main>
  </section>
</body>
</html>
