<!doctype html>
<html>
<head>
  <!-- MODE: MODE_DEMO -->
  <style>
    :root { --accent: #01C2C3; --ease-ios: cubic-bezier(.32,.72,0,1); }
    .btn { white-space: nowrap; }
    .chrome-layer, .body-container {}
    .nav { backdrop-filter: blur(10px); }
    .feed-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms; } }
  </style>
</head>
<body>
  <div class="signature">@ianzhao</div>
  <div class="workbench">
    <div class="phone-screen">
      <main class="body-container">
        <section class="feed-grid">
          <article class="feed-card"><span class="new-mark">NEW</span><div class="feed-img"></div><p>社区内容卡</p></article>
          <article class="feed-card"><span class="auth-mark">AUTH</span><div class="feed-img"></div><p>社区内容卡</p></article>
        </section>
      </main>
      <div class="chrome-layer nav">导航</div>
    </div>
    <aside class="hud"><div class="hud-title"></div><div class="hud-current"></div><div class="hud-kv"></div><div class="hud-jump"></div><div class="hud-controls"></div><div class="hud-log"></div></aside>
  </div>
  <script>const ready = true;</script>
</body>
</html>
