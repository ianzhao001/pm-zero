<!doctype html>
<html lang="zh-CN">
<head>
<!-- MODE: MODE_DEMO -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>得物世界杯竞猜 · Interactive Demo</title>
<style>
:root{--accent:#01C2C3;--accent-soft:#D9F4F4;--accent-press:#029999;--n00:#FFFFFF;--n-bg:#F5F5F9;--n20:#F1F1F5;--n40:#E6E6EB;--n80:#AAAABB;--n100:#7F7F8E;--n140:#14151A;--paper:#F6F5F1;--vip-gold:#C9A84C;--ease-ios:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;background:radial-gradient(rgba(20,21,26,.12) 1px,transparent 1px) 0 0/28px 28px,var(--paper);color:var(--n140);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text",sans-serif}.signature{position:fixed;top:16px;left:20px;z-index:10;font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--n100)}.workbench{min-height:100vh;display:grid;grid-template-columns:320px 336px;gap:34px;padding:48px;place-content:center;align-items:start}.phone-shell{width:320px;height:694px;border:1.5px solid var(--n140);border-radius:44px;padding:7px;position:relative;background:linear-gradient(180deg,var(--n00),var(--n20));box-shadow:0 2px 3px rgba(20,21,26,.08),0 18px 36px rgba(20,21,26,.14)}.phone-shell:before{content:"";position:absolute;top:12px;left:50%;width:92px;height:24px;transform:translateX(-50%);border-radius:999px;background:var(--n140);z-index:40}.phone-screen{position:relative;height:100%;overflow:hidden;border:1px solid var(--n40);border-radius:36px;background:var(--n-bg)}.body-container,.chrome-layer{position:absolute;inset:0}.body-container{z-index:1}.chrome-layer{z-index:2;pointer-events:none}.chrome{pointer-events:auto}.body{height:100%;display:flex;flex-direction:column;padding-top:78px;background:var(--n-bg);transition:transform 260ms var(--ease-ios),opacity 180ms ease}.body.with-top{padding-top:121px}.status{height:36px;padding:0 18px 4px;display:flex;align-items:flex-end;justify-content:space-between;background:rgba(255,255,255,.74);backdrop-filter:blur(16px) saturate(160%);font-size:10px;font-weight:600;color:var(--n100)}.top-tabs{height:43px;padding:0 10px;display:flex;align-items:flex-end;gap:18px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--n20);overflow:hidden}.top-tabs span{height:32px;font-size:16px;color:var(--n140);position:relative;white-space:nowrap}.top-tabs span.active{font-size:18px;font-weight:600}.top-tabs span.active:after{content:"";position:absolute;left:50%;bottom:0;width:22px;height:2px;background:var(--accent);transform:translateX(-50%)}.nav{height:42px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.8);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid rgba(241,241,245,.9)}.nav strong{font-size:16px;font-weight:500}.nav button{border:0;background:transparent;color:var(--n100);font-size:11px;font-weight:600}.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px;display:grid;gap:8px;align-content:start}.hero{min-height:136px;border-radius:10px;background:linear-gradient(135deg,var(--n140),#2B2C3C);color:var(--n00);padding:12px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}.hero .k{font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);letter-spacing:.05em}.hero h2{font-size:24px;line-height:1.2;margin:14px 0 8px}.hero p{font-size:11px;line-height:1.45;color:var(--n80);margin:0}.card{background:var(--n00);border:1px solid var(--n20);border-radius:8px;padding:9px;display:grid;gap:6px}.card strong{font-size:12px;font-weight:600}.card p{margin:0;color:var(--n100);font-size:11px;line-height:1.45}.feed-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.feed-card{background:var(--n00);border-radius:8px;overflow:hidden;border:1px solid var(--n20)}.feed-img{height:118px;background:repeating-linear-gradient(135deg,#EFEFEF 0 6px,#F7F7F7 6px 12px)}.feed-card:nth-child(2) .feed-img{height:88px}.feed-body{padding:7px;display:grid;gap:5px}.feed-body b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:600;line-height:1.35}.feed-meta{display:flex;align-items:center;gap:4px;min-width:0;color:var(--n100);font-size:11px;white-space:nowrap}.feed-meta .user{min-width:0;overflow:hidden;text-overflow:ellipsis}.like{margin-left:auto;display:inline-flex;align-items:center;gap:2px}.like svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.market{background:var(--n00);border:1px solid var(--n20);border-radius:8px;padding:8px}.market .q{font-size:12px;font-weight:500;line-height:1.35}.odds{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.odd{border-radius:4px;background:var(--accent-soft);padding:6px;text-align:center}.odd b{font-size:9px;color:var(--n100)}.odd .num{display:block;font-size:17px;color:var(--n140);font-weight:800}.btn{min-height:32px;display:flex;align-items:center;justify-content:center;white-space:nowrap;border:0;border-radius:6px;background:var(--accent);color:var(--n00);font-size:12px;font-weight:800;cursor:pointer}.btn.secondary{background:var(--n00);color:var(--n140);border:1px solid var(--n40)}.btn:active{transform:scale(.98);opacity:.88}.list{display:grid;gap:6px}.row{display:flex;align-items:center;gap:8px;background:var(--n00);border:1px solid var(--n20);border-radius:8px;padding:8px}.ava{width:18px;height:18px;border-radius:999px;background:var(--n40);flex:0 0 auto}.row b{font-size:11px}.row span{font-size:9px;color:var(--n100)}.tabbar{height:52px;background:var(--n00);border-top:1px solid var(--n20);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:8px}.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:300;color:var(--n100)}.tab svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.tab.active{color:var(--n140);font-weight:400}.tab.active svg{stroke:var(--n140)}.sheet{position:absolute;left:0;right:0;bottom:0;padding:14px;border-radius:18px 18px 0 0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);box-shadow:0 -18px 42px rgba(20,21,26,.18);pointer-events:auto;animation:sheetIn 220ms var(--ease-ios)}.sheet h3{margin:0 0 8px;font-size:15px}.toast{position:absolute;left:50%;bottom:22px;min-height:36px;transform:translateX(-50%);display:flex;align-items:center;padding:0 16px;border-radius:999px;background:rgba(20,21,26,.82);backdrop-filter:blur(18px);color:var(--n00);font-size:12px;white-space:nowrap;pointer-events:auto}.hud{position:sticky;top:48px;align-self:start;display:grid;gap:12px;max-height:calc(100vh - 96px);overflow-y:auto;padding:16px;border:1px solid var(--n40);border-radius:8px;background:rgba(255,255,255,.78);box-shadow:0 2px 3px rgba(20,21,26,.08)}.hud-title h1{margin:0 0 6px;font-size:18px}.hud-title p{margin:0;color:var(--n100);font-size:12px}.hud-current{padding:10px;border:1px solid var(--accent);border-radius:6px;color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.hud-kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hud-kv div{padding:9px;border:1px solid var(--n20);border-radius:6px;background:var(--n00);font-size:12px}.hud-jump,.hud-controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.hud button{min-height:34px;border:1px solid var(--n40);border-radius:6px;background:var(--n00);font-weight:800;cursor:pointer}.hud button.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.hud-log{min-height:130px;max-height:210px;overflow:auto;padding:10px;border-radius:6px;background:var(--n-bg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--n100);font-size:12px;white-space:pre-wrap}@keyframes sheetIn{from{transform:translateY(22px);opacity:.4}to{transform:translateY(0);opacity:1}}@media (max-width:760px){.workbench{grid-template-columns:1fr;padding:42px 18px 28px}.phone-shell{justify-self:center;width:min(320px,100%)}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="signature">@ianzhao · Dewu private mirror</div>
<main class="workbench">
  <section class="phone-shell"><div class="phone-screen"><div class="body-container" id="body-container"></div><div class="chrome-layer" id="chrome-layer"></div></div></section>
  <aside class="hud"><section class="hud-title"><h1>世界杯竞猜 HUD</h1><p>DEWU · 4 route activity demo.</p></section><section class="hud-current" id="hud-current">route: entry</section><section class="hud-kv"><div id="hud-depth">depth: 0</div><div id="hud-state">state: ready</div></section><section class="hud-jump" id="hud-jump"></section><section class="hud-controls"><button data-action="back">Back</button><button data-action="toast">Toast</button></section><section class="hud-log" id="hud-log"></section></aside>
</main>
<script>
const routes={
  entry:{title:"竞猜广场",state:"Type 1",back:false,top:true,tabs:true,body:`<section class="hero"><div class="k">WORLD CUP 2026</div><h2>你的判断，<br>就是赔率。</h2><p>活动毒币余额、热门竞猜和社区观点在首屏同场出现。</p></section><div class="feed-grid"><section class="feed-card"><div class="feed-img"></div><div class="feed-body"><b>阿根廷能赢下关键战吗？一起看赔率变化</b><span class="feed-meta"><span class="user">冷门观察员</span><span class="like"><svg viewBox="0 0 20 20"><path d="M6.5 17H4.2a1.2 1.2 0 0 1-1.2-1.2V9.7a1.2 1.2 0 0 1 1.2-1.2h2.3m0 8.5h6.7c1 0 1.9-.6 2.2-1.6l1.2-4.2A1.7 1.7 0 0 0 15 9H11l.6-3a2 2 0 0 0-.5-1.7L10.6 4 6.5 8.5V17z"></path></svg>97</span></span></div></section><section class="feed-card"><div class="feed-img"></div><div class="feed-body"><b>球鞋竞猜帖，今晚穿哪双看球更稳</b><span class="feed-meta"><span class="user">装备小队长</span><span class="like"><svg viewBox="0 0 20 20"><path d="M6.5 17H4.2a1.2 1.2 0 0 1-1.2-1.2V9.7a1.2 1.2 0 0 1 1.2-1.2h2.3m0 8.5h6.7c1 0 1.9-.6 2.2-1.6l1.2-4.2A1.7 1.7 0 0 0 15 9H11l.6-3a2 2 0 0 0-.5-1.7L10.6 4 6.5 8.5V17z"></path></svg>64</span></span></div></section></div><section class="market"><div class="q">阿根廷能赢下关键战吗？</div><div class="odds"><div class="odd"><b>正方</b><span class="num">1.6x</span></div><div class="odd"><b>反方</b><span class="num">2.5x</span></div></div><button class="btn" data-go="detail">进入竞猜</button></section>`},
  detail:{title:"竞猜详情",state:"Type 2",back:true,top:false,tabs:false,body:`<section class="market"><div class="q">阿根廷能赢下关键战吗？</div><p>@ianzhao 已选择正方 120 毒币，当前 62% 支持正方。</p><div class="odds"><div class="odd"><b>正方</b><span class="num">1.6x</span></div><div class="odd"><b>反方</b><span class="num">2.5x</span></div></div></section><section class="card"><strong>投入确认</strong><p>投入数量、预计获得、手续费都在同屏完成。</p></section><button class="btn" data-sheet="bet">投注 · 正方 1.6x</button>`},
  result:{title:"结算状态",state:"Type 2",back:true,top:false,tabs:false,body:`<section class="hero"><div class="k">PREDICTION HIT</div><h2>命中 +192</h2><p>到账、分享、继续投注三个动作合并在结算页，不新增结果分支页面。</p></section><section class="card"><strong>异常承接</strong><p>未开奖、失败重试、已过期都作为状态卡处理。</p></section><button class="btn" data-go="discussion">查看讨论</button>`},
  discussion:{title:"讨论与排行",state:"Type 2",back:true,top:false,tabs:false,body:`<section class="card"><strong>毒评家榜</strong><p>讨论、排行、观点列表使用单列，不伪装成 feed-grid。</p></section><div class="list"><div class="row"><span class="ava"></span><div><b>立昂 · 当前 #14</b><br><span>距 #13 还差 280 毒币</span></div></div><div class="row"><span class="ava"></span><div><b>夜枭：看好正方</b><br><span>342 赞 · 18 回复</span></div></div><div class="row"><span class="ava"></span><div><b>闪火：反方赔率更值</b><br><span>118 赞 · 9 回复</span></div></div></div>`}
};
const order=Object.keys(routes);const stack=["entry"];const log=[];let current="entry";
function record(msg){log.unshift(new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})+"  "+msg);document.getElementById("hud-log").textContent=log.slice(0,12).join("\n")}
function topTabs(){return `<div class="top-tabs"><span class="active">推荐</span><span>极光街</span><span>运营活动</span><span>灵感</span><span>关注</span><span>穿搭</span></div>`}
function chromeMarkup(route){return `<div class="chrome"><div class="status"><span>9:41</span><span>5G</span></div>${route.top?topTabs():""}<div class="nav">${route.back?'<button data-action="back">返回</button>':'<span></span>'}<strong>${route.title}</strong><button data-action="toast">保存</button></div></div>`}
function tabbar(){const icons=['<path d="M3 9l7-6 7 6v8H3z"></path>','<path d="M4 5h12l-1 8H6L4 5z"></path><path d="M7 16h.1M14 16h.1"></path>','<path d="M4 5h12v8H8l-4 3z"></path>','<circle cx="10" cy="7" r="3"></circle><path d="M4 17c1-4 11-4 12 0"></path>'];const names=["得物","购买","探索","我"];return `<div class="tabbar">${names.map((name,i)=>`<div class="tab ${i===0?"active":""}"><svg viewBox="0 0 20 20">${icons[i]}</svg><span>${name}</span></div>`).join("")}</div>`}
function renderLayer(kind){const route=routes[current];const layer=document.getElementById("chrome-layer");if(kind==="bet"){layer.innerHTML=`${chromeMarkup(route)}<section class="sheet"><h3>确认投注</h3><p class="card p">投入 120 毒币，预计获得 192。</p><button class="btn" data-go="result">确认投注</button><button class="btn secondary" data-close="1">取消</button></section>`;record("sheet opened");return}if(kind==="toast"){layer.innerHTML=`${chromeMarkup(route)}<div class="toast">已保存到活动记录</div>`;record("toast shown");setTimeout(()=>{if(layer.querySelector(".toast"))layer.innerHTML=chromeMarkup(routes[current])},1100);return}layer.innerHTML=chromeMarkup(route)}
function render(){const route=routes[current];document.getElementById("body-container").innerHTML=`<section class="body ${route.top?"with-top":""}"><div class="content">${route.body}</div>${route.tabs?tabbar():""}</section>`;renderLayer("");document.getElementById("hud-current").textContent=`route: ${current}`;document.getElementById("hud-depth").textContent=`depth: ${stack.length-1}`;document.getElementById("hud-state").textContent=`state: ${route.state}`;document.getElementById("hud-jump").innerHTML=order.map(id=>`<button class="${id===current?"active":""}" data-go="${id}">${id}</button>`).join("");record("render "+current)}
function go(next){if(!routes[next])return;current=next;if(stack[stack.length-1]!==next)stack.push(next);render()}
function back(){if(stack.length>1)stack.pop();current=stack[stack.length-1];render()}
document.addEventListener("click",event=>{const t=event.target.closest("[data-go],[data-action],[data-sheet],[data-close]");if(!t)return;if(t.dataset.close)return renderLayer("");if(t.dataset.go)return go(t.dataset.go);if(t.dataset.sheet)return renderLayer(t.dataset.sheet);if(t.dataset.action==="back")return back();if(t.dataset.action==="toast")return renderLayer("toast")});
render();
</script>
<!-- VERSION: v1.1.0 -->
<!-- CHANGES: replace wishlist canonical demo with compact Dewu activity demo, centered workbench, fixed chrome, scrollable phone body -->
<!-- BASED ON: uploaded World Cup interaction reference + dewu context pack -->
</body>
</html>
